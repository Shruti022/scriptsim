version: '3.8'

services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
    restart: unless-stopped
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro

  shop:
    build:
      context: ./apps/shop
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    restart: unless-stopped

  job_board:
    build:
      context: ./apps/job_board
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    restart: unless-stopped

  doctor_booking:
    build:
      context: ./apps/doctor_booking
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    restart: unless-stopped
